<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Cotizaciones | LA Propiedades</title>
  <style>
    :root{--navy:#0b1b2a;--gold:#cdbE6b;--gold2:#9b783a;--ink:#17212b;--muted:#6b7280;--line:#e4e5e7;--bg:#f5f6f7;--ok:#2f7d3c;--warn:#9b6a18;--bad:#9d3030}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
    .adm-wrap{max-width:1500px;margin:0 auto;padding:24px}
    .adm-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:20px}
    .adm-head h1{margin:0;font-size:28px}
    .adm-head p{margin:6px 0 0;color:var(--muted);font-size:13px}
    .adm-actions{display:flex;gap:10px;flex-wrap:wrap}
    button,input{font:inherit}
    .adm-btn{min-height:42px;padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer;font-weight:600}
    .adm-btn--gold{background:linear-gradient(90deg,var(--gold2),var(--gold));border:0;color:#111}
    .adm-btn:disabled{opacity:.5;cursor:not-allowed}
    .adm-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
    .adm-search{flex:1;min-width:240px;min-height:42px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
    .adm-count{color:var(--muted);font-size:12px}
    .adm-card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
    .adm-table-wrap{overflow:auto}
    table{width:100%;border-collapse:collapse;min-width:1120px}
    th,td{padding:12px 11px;border-bottom:1px solid #ececef;text-align:left;vertical-align:middle;font-size:12px}
    th{position:sticky;top:0;background:#fafafa;color:#555;font-size:11px;text-transform:uppercase;letter-spacing:.04em;z-index:1}
    tbody tr{cursor:pointer}
    tbody tr:hover{background:#fbfaf6}
    .adm-name{font-weight:700}
    .adm-sub{display:block;margin-top:3px;color:var(--muted);font-size:11px}
    .adm-money{font-weight:700;white-space:nowrap}
    .adm-badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eceff1;color:#556;font-size:10.5px;font-weight:700;white-space:nowrap}
    .adm-badge.ok{background:#e8f5ea;color:var(--ok)}
    .adm-badge.warn{background:#fff4db;color:var(--warn)}
    .adm-badge.bad{background:#fdeaea;color:var(--bad)}
    .adm-row-actions{display:flex;gap:7px;white-space:nowrap}
    .adm-mini{min-height:34px;padding:6px 9px;border:1px solid #d9dadd;border-radius:7px;background:#fff;cursor:pointer;font-size:11px;font-weight:700}
    .adm-mini:hover{border-color:#b79649}
    .adm-empty,.adm-error{padding:34px;text-align:center;color:var(--muted)}
    .adm-error{color:var(--bad)}
    .adm-login{max-width:460px;margin:80px auto;padding:28px;background:#fff;border:1px solid var(--line);border-radius:12px}
    .adm-login h2{margin:0 0 8px}.adm-login p{margin:0 0 18px;color:var(--muted);font-size:13px}
    .adm-login input{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
    @media(max-width:720px){.adm-wrap{padding:14px}.adm-head{align-items:flex-start;flex-direction:column}.adm-actions{width:100%}.adm-actions .adm-btn{flex:1}.adm-search{width:100%}}
  </style>
</head>
<body>
<main id="lap-admin" data-api-url="https://laprop-cotizador-api.onrender.com">
  <section class="adm-login" id="adm-login">
    <h2>LA Propiedades</h2>
    <p>Panel interno de tasaciones. Ingresá el token de acceso.</p>
    <form id="adm-login-form">
      <input id="adm-token" type="password" autocomplete="current-password" placeholder="Token interno" required>
      <button class="adm-btn adm-btn--gold" type="submit">Ingresar</button>
    </form>
    <div class="adm-error" id="adm-login-error" style="display:none;padding:14px 0 0"></div>
  </section>

  <section class="adm-wrap" id="adm-panel" hidden>
    <div class="adm-head">
      <div><h1>Tasaciones</h1><p>Control interno de solicitudes, informes y entregas al cliente.</p></div>
      <div class="adm-actions">
        <button class="adm-btn" type="button" id="adm-refresh">Actualizar</button>
        <button class="adm-btn" type="button" id="adm-logout">Salir</button>
      </div>
    </div>

    <div class="adm-toolbar">
      <input class="adm-search" id="adm-search" type="search" placeholder="Buscar por nombre, mail, dirección, barrio o tipo…">
      <span class="adm-count" id="adm-count"></span>
    </div>

    <div class="adm-card">
      <div class="adm-table-wrap">
        <table>
          <thead>
            <tr>
              <th>Fecha / hora</th>
              <th>Cliente</th>
              <th>Propiedad</th>
              <th>Tipo</th>
              <th>Amb.</th>
              <th>Baños</th>
              <th>Valor estimado</th>
              <th>Correo</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="adm-body"></tbody>
        </table>
      </div>
      <div class="adm-empty" id="adm-empty" hidden>No hay tasaciones para mostrar.</div>
      <div class="adm-error" id="adm-error" hidden></div>
    </div>
  </section>
</main>

<script>
(()=>{
  const root=document.getElementById('lap-admin');
  const API=(root.dataset.apiUrl||'').replace(/\/+$/,'');
  const login=document.getElementById('adm-login');
  const panel=document.getElementById('adm-panel');
  const form=document.getElementById('adm-login-form');
  const tokenInput=document.getElementById('adm-token');
  const loginError=document.getElementById('adm-login-error');
  const body=document.getElementById('adm-body');
  const empty=document.getElementById('adm-empty');
  const errorBox=document.getElementById('adm-error');
  const count=document.getElementById('adm-count');
  const search=document.getElementById('adm-search');
  let token=sessionStorage.getItem('laprop_internal_token')||'';
  let items=[];

  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  const fmtDate=v=>{
    if(!v)return '-';
    const d=new Date(v);
    if(Number.isNaN(d.getTime()))return esc(v);
    return new Intl.DateTimeFormat('es-AR',{dateStyle:'short',timeStyle:'short'}).format(d);
  };
  const fmtMoney=v=>{
    const n=Number(v);
    return Number.isFinite(n)?'USD '+new Intl.NumberFormat('es-AR',{maximumFractionDigits:0}).format(n):'-';
  };
  const emailBadge=v=>{
    const s=String(v||'').toLowerCase();
    if(s==='enviado')return '<span class="adm-badge ok">Enviado</span>';
    if(s==='error')return '<span class="adm-badge bad">Error</span>';
    if(s==='no_configurado')return '<span class="adm-badge bad">No configurado</span>';
    return '<span class="adm-badge warn">'+esc(v||'Pendiente')+'</span>';
  };

  function headers(){return {'X-Internal-Token':token,'Accept':'application/json'}}

  async function apiFetch(path,opts={}){
    const res=await fetch(API+path,{...opts,headers:{...(opts.headers||{}),'X-Internal-Token':token}});
    if(res.status===401){
      sessionStorage.removeItem('laprop_internal_token');
      token='';
      showLogin('El token no fue aceptado.');
      throw new Error('Acceso interno no autorizado');
    }
    return res;
  }

  function showLogin(message=''){
    panel.hidden=true;
    login.hidden=false;
    if(message){loginError.textContent=message;loginError.style.display='block'}else{loginError.style.display='none'}
    tokenInput.focus();
  }

  function showPanel(){
    login.hidden=true;
    panel.hidden=false;
    loginError.style.display='none';
  }

  function filtered(){
    const q=search.value.trim().toLowerCase();
    if(!q)return items;
    return items.filter(x=>[
      x.nombre,x.email,x.direccion,x.barrio,x.tipo,x.telefono
    ].some(v=>String(v||'').toLowerCase().includes(q)));
  }

  function render(){
    const rows=filtered();
    count.textContent=`${rows.length} de ${items.length} tasaciones`;
    body.innerHTML='';
    errorBox.hidden=true;
    empty.hidden=rows.length!==0;
    for(const x of rows){
      const tr=document.createElement('tr');
      tr.dataset.id=x.id;
      tr.title='Abrir informe interno';
      tr.innerHTML=`
        <td>${fmtDate(x.created_at)}</td>
        <td><span class="adm-name">${esc(x.nombre||'-')}</span><span class="adm-sub">${esc(x.email||'')}</span></td>
        <td><span class="adm-name">${esc(x.direccion||'-')}</span><span class="adm-sub">${esc(x.barrio||'-')}</span></td>
        <td>${esc(x.tipo||'-')}</td>
        <td>${esc(x.ambientes??'-')}</td>
        <td>${esc(x.banos??'-')}</td>
        <td class="adm-money">${fmtMoney(x.valor_usd)}</td>
        <td>${emailBadge(x.email_status)}</td>
        <td><div class="adm-row-actions">
          <button class="adm-mini" type="button" data-action="interno">Informe interno</button>
          <button class="adm-mini" type="button" data-action="pdf" ${x.tiene_pdf_publico?'':'disabled'}>PDF cliente</button>
        </div></td>`;
      body.appendChild(tr);
    }
  }

  async function load(){
    errorBox.hidden=true;
    const res=await apiFetch('/api/admin/cotizaciones?limit=500',{headers:{Accept:'application/json'}});
    const data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(data.detail||'No se pudo cargar el listado.');
    items=Array.isArray(data.items)?data.items:[];
    showPanel();
    render();
  }

  async function openInternal(id){
    const popup=window.open('about:blank','_blank');
    try{
      const res=await apiFetch(`/api/tasaciones/${encodeURIComponent(id)}/interno`,{headers:{Accept:'text/html'}});
      if(!res.ok){
        const data=await res.json().catch(()=>({}));
        throw new Error(data.detail||'No se pudo abrir el informe interno.');
      }
      const txt=await res.text();
      const url=URL.createObjectURL(new Blob([txt],{type:'text/html;charset=utf-8'}));
      if(popup)popup.location.href=url; else window.open(url,'_blank','noopener');
      setTimeout(()=>URL.revokeObjectURL(url),600000);
    }catch(err){
      if(popup)popup.close();
      alert(err.message||'No se pudo abrir el informe interno.');
    }
  }

  async function downloadPdf(id){
    try{
      const res=await apiFetch(`/api/admin/tasaciones/${encodeURIComponent(id)}/pdf-enviado`,{headers:{Accept:'application/pdf'}});
      if(!res.ok){
        const data=await res.json().catch(()=>({}));
        throw new Error(data.detail||'No se pudo descargar el PDF.');
      }
      const disp=res.headers.get('content-disposition')||'';
      const match=disp.match(/filename="?([^";]+)"?/i);
      const blob=await res.blob();
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download=match?match[1]:`tasacion-${id.slice(0,8)}.pdf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    }catch(err){alert(err.message||'No se pudo descargar el PDF.')}
  }

  form.addEventListener('submit',async e=>{
    e.preventDefault();
    token=tokenInput.value.trim();
    if(!token)return;
    sessionStorage.setItem('laprop_internal_token',token);
    try{await load()}catch(err){showLogin(err.message||'No se pudo ingresar.')}
  });

  document.getElementById('adm-refresh').addEventListener('click',()=>load().catch(err=>{
    errorBox.textContent=err.message||'No se pudo actualizar.';
    errorBox.hidden=false;
  }));
  document.getElementById('adm-logout').addEventListener('click',()=>{
    sessionStorage.removeItem('laprop_internal_token');
    token='';
    tokenInput.value='';
    items=[];
    showLogin();
  });
  search.addEventListener('input',render);

  body.addEventListener('click',e=>{
    const btn=e.target.closest('button[data-action]');
    const tr=e.target.closest('tr[data-id]');
    if(!tr)return;
    const id=tr.dataset.id;
    if(btn){
      e.stopPropagation();
      if(btn.dataset.action==='interno')openInternal(id);
      if(btn.dataset.action==='pdf'&&!btn.disabled)downloadPdf(id);
      return;
    }
    openInternal(id);
  });

  if(token){
    load().catch(()=>showLogin('La sesión interna venció o el token ya no es válido.'));
  }else{
    showLogin();
  }
})();
</script>
</body>
</html>
